<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Movie Translator</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#fff;margin:0;padding:24px}
.card{max-width:700px;margin:auto;background:#1c1c1e;border-radius:20px;padding:22px}
h1{margin-top:0}
label{display:block;margin:14px 0 6px}
select,button{width:100%;padding:14px;border-radius:12px;border:0;font-size:17px;margin-bottom:10px}
button{background:#fff;color:#111;font-weight:600}
button:disabled{opacity:.45}
.status{padding:12px;border-radius:12px;background:#2c2c2e;margin:10px 0}
.box{background:#0b0b0c;border-radius:14px;padding:15px;margin-top:12px;min-height:70px;line-height:1.6}
.small{color:#aaa;font-size:14px}
#level{height:10px;background:#333;border-radius:8px;overflow:hidden;margin:12px 0}
#bar{height:100%;width:0;background:#fff;transition:width .08s}
</style>
</head>
<body>
<div class="card">
<h1>🎬 Movie Translator</h1>
<p class="small">استمع لصوت الفيلم من سماعة الهاتف وحوّله إلى نص ثم ترجمه للعربية.</p>

<label>لغة الفيلم</label>
<select id="lang">
<option value="en-US">English</option>
<option value="de-DE">Deutsch</option>
<option value="fr-FR">Français</option>
<option value="tr-TR">Türkçe</option>
</select>

<button id="start">🎙️ بدء الترجمة</button>
<button id="stop" disabled>⏹️ إيقاف</button>

<div class="status" id="status">جاهز</div>
<div id="level"><div id="bar"></div></div>

<div class="small">النص الأصلي</div>
<div class="box" id="original">—</div>

<div class="small" style="margin-top:12px">الترجمة العربية</div>
<div class="box" id="arabic">—</div>
</div>

<script>
let recognition;
let listening=false;
let finalText="";
let audioCtx, analyser, mic, raf;

const startBtn=document.getElementById("start");
const stopBtn=document.getElementById("stop");
const statusEl=document.getElementById("status");
const originalEl=document.getElementById("original");
const arabicEl=document.getElementById("arabic");
const langEl=document.getElementById("lang");
const bar=document.getElementById("bar");

function setStatus(t){statusEl.textContent=t;}

async function startMeter(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=256;
    mic=audioCtx.createMediaStreamSource(stream);
    mic.connect(analyser);
    const data=new Uint8Array(analyser.frequencyBinCount);
    function draw(){
      if(!analyser)return;
      analyser.getByteFrequencyData(data);
      let sum=0;
      for(const x of data) sum+=x*x;
      const rms=Math.sqrt(sum/data.length);
      bar.style.width=Math.min(100,rms*1.8)+"%";
      raf=requestAnimationFrame(draw);
    }
    draw();
  }catch(e){
    setStatus("لم يتم السماح بالميكروفون.");
  }
}

async function translateToArabic(text){
  if(!text.trim()) return;
  arabicEl.textContent="جارٍ الترجمة…";
  const source=langEl.value.split("-")[0];
  try{
    const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+encodeURIComponent(source+"|ar");
    const r=await fetch(url);
    const data=await r.json();
    const translated=data?.responseData?.translatedText;
    arabicEl.textContent=translated || "تعذرت الترجمة";
  }catch(e){
    arabicEl.textContent="تعذرت الترجمة. تحقق من الإنترنت.";
  }
}

function setupRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    setStatus("المتصفح لا يدعم التعرف على الكلام. جرّب Safari أو Chrome.");
    return null;
  }
  const r=new SR();
  r.lang=langEl.value;
  r.continuous=true;
  r.interimResults=true;
  r.maxAlternatives=1;

  r.onstart=()=>setStatus("🎧 أستمع لصوت الفيلم…");
  r.onresult=(event)=>{
    let interim="";
    for(let i=event.resultIndex;i<event.results.length;i++){
      const text=event.results[i][0].transcript;
      if(event.results[i].isFinal) finalText += text+" ";
      else interim += text;
    }
    originalEl.textContent=(finalText+" "+interim).trim() || "—";
    if(finalText.trim()) translateToArabic(finalText.trim());
  };
  r.onerror=(e)=>{
    if(e.error==="not-allowed") setStatus("الميكروفون غير مسموح.");
    else setStatus("مشكلة في التعرف على الكلام: "+e.error);
  };
  r.onend=()=>{
    if(listening){
      try{ r.lang=langEl.value; r.start(); }catch(e){}
    }else{
      setStatus("متوقف");
    }
  };
  return r;
}

startBtn.onclick=async()=>{
  finalText="";
  originalEl.textContent="—";
  arabicEl.textContent="—";
  await startMeter();
  recognition=setupRecognition();
  if(!recognition)return;
  listening=true;
  startBtn.disabled=true;
  stopBtn.disabled=false;
  try{recognition.start();}catch(e){}
};

stopBtn.onclick=()=>{
  listening=false;
  startBtn.disabled=false;
  stopBtn.disabled=true;
  if(recognition) try{recognition.stop();}catch(e){}
  if(audioCtx) try{audioCtx.close();}catch(e){}
  recognition=null;
  cancelAnimationFrame(raf);
  bar.style.width="0";
  setStatus("متوقف");
};
</script>
</body>
</html>
